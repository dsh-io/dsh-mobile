name: android-build
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  rootfs:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Build minimal rootfs
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq debootstrap
          sudo ./rootfs/build-rootfs.sh /tmp/rootfs-out

      - name: Smoke-test rootfs (node runs inside it)
        run: |
          mkdir -p /tmp/rootfs
          # sudo tar: restore modes fully (Debian / is 1755); --no-same-owner
          # --touch: keep files owned by root and skip mtime restore.
          sudo tar xJf /tmp/rootfs-out/debian.tar.xz -C /tmp/rootfs --no-same-owner --touch
          # proot (Debian 5.1.0) SIGSEGVs on GitHub arm runners (ptrace in
          # nested virtualization); on Android the Termux-fork proot is
          # device-verified. chroot exercises the same rootfs+node combo
          # without ptrace.
          sudo chroot /tmp/rootfs /usr/bin/env -i HOME=/root PATH=/usr/bin:/bin node --version
          sudo rm -rf /tmp/rootfs

      - name: Engine smoke test (dsh web boots inside rootfs)
        run: |
          mkdir -p /tmp/rootfs
          sudo tar xJf /tmp/rootfs-out/debian.tar.xz -C /tmp/rootfs --no-same-owner --touch
          curl -fsSL -o /tmp/dsh.tar.gz \
            "https://github.com/dsh-io/dsh-arm64/releases/download/v0.1.0-rc.6/dsh-arm64-0.1.0-rc.6.tar.gz"
          sudo mkdir -p /tmp/rootfs/dsh
          sudo tar xzf /tmp/dsh.tar.gz -C /tmp/rootfs/dsh
          # same launch contract as the app's daemon.rs: node --expose-internals
          sudo chroot /tmp/rootfs /usr/bin/env -i HOME=/root PATH=/usr/bin:/bin \
            nohup node --expose-internals /dsh/node_modules/@deepseek-ai/dsh/lib/bin.js web \
            >/tmp/engine.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS -o /dev/null http://127.0.0.1:3080 && break
            sleep 2
          done
          curl -fsS -o /dev/null http://127.0.0.1:3080 || {
            echo "!! engine did not come up on 127.0.0.1:3080"
            tail -30 /tmp/engine.log
            sudo pkill -f bin.js || true
            exit 1
          }
          echo "==> engine smoke OK: 127.0.0.1:3080 responds"
          sudo pkill -f bin.js || true
          sudo rm -rf /tmp/rootfs /tmp/dsh.tar.gz

      - name: Extract-test rootfs with the app's own extractor (unprivileged)
        # The smoke tests above use `sudo tar` + chroot, which never run the
        # app's Rust extraction path. This runs it as the unprivileged runner
        # user against the real artifact — the exact conditions a device app
        # hits (non-root, arm64). A failure here is a device failure.
        run: |
          rustup toolchain install stable --profile minimal
          cd rust
          cargo build --release --example verify_extract
          rm -rf /tmp/rootfs-extract
          SHA=$(cat /tmp/rootfs-out/debian.tar.xz.sha256)
          ./target/release/examples/verify_extract \
            /tmp/rootfs-out/debian.tar.xz /tmp/rootfs-extract "$SHA"
          ls /tmp/rootfs-extract/bin/sh
          rm -rf /tmp/rootfs-extract

      - name: Upload rootfs artifact
        uses: actions/upload-artifact@v5
        with:
          name: dsh-rootfs
          path: /tmp/rootfs-out/

  build:
    needs: rootfs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools build-tools;35.0.0 platforms;android-35 ndk;26.3.11579264"

      - name: Install Rust Android targets
        run: |
          rustup toolchain install stable
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --locked

      - name: Rust host tests (fail fast, before heavy builds)
        run: cd rust && cargo test --workspace

      - name: Build proot binary
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/26.3.11579264"
          ./tools/build-proot.sh aarch64-linux-android

      - name: Build Rust JNI libs
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/26.3.11579264"
          cd rust && cargo ndk -t arm64-v8a -o ../app/src/main/jniLibs build --release

      - name: Download rootfs artifact
        uses: actions/download-artifact@v5
        with:
          name: dsh-rootfs
          path: /tmp/rootfs

      - name: Fetch dsh-arm64 release package
        run: |
          mkdir -p app/src/main/assets/dsh app/src/main/assets/rootfs
          cp /tmp/rootfs/debian.tar.xz app/src/main/assets/rootfs/
          cp /tmp/rootfs/debian.tar.xz.sha256 app/src/main/assets/rootfs/
          curl -fsSL -o app/src/main/assets/dsh/dsh-arm64-0.1.0-rc.6.tar.gz \
            "https://github.com/dsh-io/dsh-arm64/releases/download/v0.1.0-rc.6/dsh-arm64-0.1.0-rc.6.tar.gz"
          # enforce the hash pinned in the plan (fail the build on drift);
          # run inside the asset dir so sha256sum resolves the file name
          (cd app/src/main/assets/dsh && echo "b8aa98f46f750bd909a105434a271276baab8893e786805b5a613cfc2fb65ba6  dsh-arm64-0.1.0-rc.6.tar.gz" \
            | sha256sum -c -) || (echo "!! dsh package sha256 mismatch (pinned in plan)" && exit 1)
          # bare 64-hex hash asset, consumed by NativeLib.extractVerified
          echo -n "b8aa98f46f750bd909a105434a271276baab8893e786805b5a613cfc2fb65ba6" \
            > app/src/main/assets/dsh/dsh-arm64-0.1.0-rc.6.tar.gz.sha256
          ls -la app/src/main/assets/dsh/ app/src/main/assets/rootfs/

      - name: Build APK
        run: ./gradlew assembleRelease --no-daemon
        env:
          DSHMOBILE_KEYSTORE_B64: ${{ secrets.DSHMOBILE_KEYSTORE_B64 }}
          DSHMOBILE_STORE_PASS: ${{ secrets.DSHMOBILE_STORE_PASS }}
          DSHMOBILE_KEY_PASS: ${{ secrets.DSHMOBILE_KEY_PASS }}
          DSHMOBILE_KEY_ALIAS: ${{ secrets.DSHMOBILE_KEY_ALIAS }}

      - name: Verify APK
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "APK=$APK"
          unzip -t "$APK" | tail -1
          ls -la "$APK"
          $ANDROID_SDK_ROOT/build-tools/35.0.0/aapt dump badging "$APK" | head -3
          $ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner verify --print-certs "$APK" > /tmp/certs.txt
          grep -q "Signer #1 certificate DN" /tmp/certs.txt || (echo "APK IS NOT SIGNED" && exit 1)
          unzip -l "$APK" | grep -E "assets/(rootfs/debian.tar.xz|dsh/dsh-arm64)"
          # noCompress regression check: .xz/.gz assets must be Stored, not
          # Defl (double compression breaks openFd() on device)
          if unzip -v "$APK" | grep -E "assets/.*\.(xz|gz)$" | grep -q Defl; then
            echo "!! asset double-compressed (noCompress missing)"
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: dsh-mobile-apk
          path: app/build/outputs/apk/release/*.apk

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK (for apksigner)
        uses: android-actions/setup-android@v4
        with:
          packages: "build-tools;35.0.0"

      - name: Download APK
        uses: actions/download-artifact@v5
        with:
          name: dsh-mobile-apk
          path: dist

      - name: Rename with version
        run: |
          APK=$(ls dist/*.apk | head -1)
          mv "$APK" "dist/dsh-mobile-${GITHUB_REF_NAME}.apk"

      - name: Verify release APK signature
        run: |
          $ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner verify --print-certs "dist/dsh-mobile-${GITHUB_REF_NAME}.apk" | grep -q "Signer #1 certificate DN" \
            || (echo "RELEASE APK IS NOT SIGNED" && exit 1)

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true